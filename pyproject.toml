[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attackgraph"
version = "0.1.0"
description = "Turns lab audit findings into explainable attack paths, risk scores and a prioritized fix list."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["attackgraph[server]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
attackgraph = "attackgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attackgraph = ["web/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
