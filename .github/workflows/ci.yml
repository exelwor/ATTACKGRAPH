name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Analyze the sample audit
        run: |
          attackgraph sample > sample.json
          attackgraph analyze sample.json -o report.html --md report.md
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: sample-report
          path: |
            report.html
            report.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t attackgraph .
      - name: Smoke test the container
        run: |
          docker run -d --name ag -p 8000:8000 attackgraph
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break || sleep 1; done
          curl -fs localhost:8000/api/sample | curl -fs -X POST -H 'Content-Type: application/json' --data-binary @- localhost:8000/api/analyze | grep -q '"paths"'
